# .github/workflows/deploy.yml
name: Build and Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare sources
        run: |
          set -e
          if [ -n "${{ secrets.NODE_SOURCES }}" ]; then
            echo "${{ secrets.NODE_SOURCES }}" > sources.txt
            echo "Using NODE_SOURCES secret"
          else
            echo "Extracting URLs from sources.yaml"
            grep -E '^\s+url:' sources.yaml | sed 's/.*url: *//' | grep -v '^$' > sources.txt
          fi
          echo "=== sources.txt ==="
          cat sources.txt
          echo "=== source count: $(wc -l < sources.txt) ==="

      - name: Download subconverter (tindy2013 v0.9.0)
        run: |
          set -e
          wget -q https://github.com/tindy2013/subconverter/releases/download/v0.9.0/subconverter_linux64.tar.gz -O sub.tar.gz
          mkdir -p subconverter
          tar -xzf sub.tar.gz -C subconverter/
          chmod +x subconverter/subconverter
          ls -la subconverter/
          ./subconverter/subconverter -h 2>&1 | head -5

      - name: Generate nodes
        run: |
          set -e
          echo "Running subconverter..."
          ./subconverter/subconverter -u sources.txt -o output.yaml -f Clash
          echo "=== subconverter exit: $? ==="
          mkdir -p public
          cp output.yaml public/free-nodes.yaml
          echo "=== output.yaml preview (first 40 lines) ==="
          head -40 public/free-nodes.yaml
          echo "=== node count: $(grep -c 'name:' public/free-nodes.yaml 2>/dev/null || echo 0) ==="

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Deploy to Cloudflare Pages
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          echo "Deploying to CF Pages project: node-sub"
          wrangler pages deploy public \
            --project-name node-sub \
            --branch main
