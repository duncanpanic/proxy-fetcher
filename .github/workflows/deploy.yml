name: Build and Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare sources
        run: |
          set -e
          if [ -n "${{ secrets.NODE_SOURCES }}" ]; then
            echo "${{ secrets.NODE_SOURCES }}" > sources.txt
            echo "使用 NODE_SOURCES Secret"
          else
            echo "从 sources.yaml 提取订阅源"
            grep -E '^\s+url:' sources.yaml | sed 's/.*url: *//' | tr -d '"' | grep -v '^$' > sources.txt
          fi
          echo "=== 源数量: $(wc -l < sources.txt) ==="

      - name: Download and extract subconverter
        run: |
          set -e
          wget -q https://github.com/tindy2013/subconverter/releases/download/v0.9.0/subconverter_linux64.tar.gz -O sub.tar.gz
          tar -xzf sub.tar.gz
          chmod +x subconverter/subconverter

      - name: Start subconverter service
        run: |
          set -e
          ./subconverter/subconverter > subconverter.log 2>&1 &
          for i in {1..30}; do
            if curl -s -o /dev/null http://127.0.0.1:25500; then
              echo "subconverter 服务已就绪"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "subconverter 服务启动超时，日志如下："
              cat subconverter.log
              exit 1
            fi
            sleep 1
          done

      - name: Generate merged Clash config via API
        run: |
          set -e
          mkdir -p public
          SOURCES_JOINED=$(paste -sd'|' sources.txt)
          ENCODED_URL=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$SOURCES_JOINED")
          
          echo "正在调用 subconverter API..."
          curl -sS --fail "http://127.0.0.1:25500/sub?target=clash&url=${ENCODED_URL}" -o public/free-nodes.yaml

          if [ ! -s public/free-nodes.yaml ] || ! grep -q "proxies:" public/free-nodes.yaml; then
            echo "错误：生成的配置文件无效"
            exit 1
          fi
          echo "=== 生成成功，节点预览 ==="
          head -n 20 public/free-nodes.yaml

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          # 注意：这里的 project-name 已修改为你截图中的 proxy-fetcher
          wrangler pages deploy public \
            --project-name proxy-fetcher \
            --branch main