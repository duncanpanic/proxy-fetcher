name: Deploy Subscription to Cloudflare Pages

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup subconverter-ng
        run: |
          curl -L -o subconverter https://github.com/Jungley8/subconverter-ng/releases/latest/download/subconverter-linux
          chmod +x subconverter

      - name: Generate free-nodes.yaml
        env:
          NODE_SOURCES: ${{ secrets.NODE_SOURCES }}
        run: |
          echo "$NODE_SOURCES" > sources.txt
          ./subconverter \
            -sources sources.txt \
            -output free-nodes.yaml \
            -dedup -fdn \
            -filter-protocol "vmess|vless|trojan|shadowsocks|hysteria2|tuic" \
            -filter-country "US,JP,SG,HK,TW,DE,NL" \
            -test-url "http://cp.cloudflare.com/generate_204" \
            -test-timeout 3000 \
            -max-latency 3000 \
            -sort-by latency \
            -top 50

      - name: Deploy to Cloudflare Pages (主链路)
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          projectName: proxy-fetcher
          directory: .

      - name: Deploy to GitHub Pages (备链路)
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          keep_files: false
