# .github/workflows/deploy.yml
name: Build and Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install subconverter
        run: |
          wget -q https://github.com/Humbertg/subconverter-ng/releases/latest/download/subconverter-linux.zip -O sub.zip
          unzip -o sub.zip -d subconverter/
          chmod +x subconverter/subconverter
          echo "$GITHUB_WORKSPACE/subconverter" >> $GITHUB_PATH

      - name: Generate nodes
        run: |
          echo "${{ secrets.NODE_SOURCES }}" > sources.txt
          subconverter -u sources.txt -o output.yaml -f Clash
          mkdir -p public
          cp output.yaml public/free-nodes.yaml

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Deploy to Cloudflare Pages
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          wrangler pages deploy public \
            --project-name node-sub \
            --branch main
