name: Build and Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install js-yaml

      - name: Run Fetch Script to filter alive nodes
        run: |
          mkdir -p public
          node fetch.js

      - name: Check output
        run: |
          if [ ! -s public/free-nodes.yaml ]; then
            echo "错误：fetch.js 没有生成文件或文件为空"
            exit 1
          fi
          echo "=== 存活节点数量: $(grep -c 'name:' public/free-nodes.yaml || echo 0) ==="

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          wrangler pages deploy public \
            --project-name proxy-fetcher \
            --branch main